<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Study Material</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #151922 100%);
            --header-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        header {
            background: var(--header-gradient);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            border-bottom: 4px solid var(--accent-color);
        }

        header h1 {
            margin: 0;
            font-size: 2.6rem;
            font-weight: 800;
        }

        header p {
            margin: 0.6rem 0 0;
            color: #e2e8f0;
            font-size: 1.15rem;
        }

        .admin-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.12);
            padding: 0.6rem 1.3rem;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .admin-badge:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .breadcrumb {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
        }

        .breadcrumb span:hover {
            text-decoration: underline;
        }

        .admin-panel {
            background: rgba(15, 23, 42, 0.95);
            padding: 2.2rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 2.5rem;
            display: none;
            gap: 1.2rem;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .admin-panel input {
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            background: #020617;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            flex: 1;
            min-width: 240px;
            outline: none;
        }

        .admin-panel button {
            padding: 0.9rem 1.8rem;
            font-size: 1rem;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.35s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .book-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent-color);
        }

        .book-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .book-card h3 {
            margin: 0;
            font-size: 1.4rem;
            color: #ffffff;
        }

        .book-card p {
            margin: 0.5rem 0 0;
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-block;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .paper-row {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .paper-links {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .paper-links a {
            text-decoration: none;
            background: #334155;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .paper-links a:hover {
            background: #475569;
        }

        .paper-links a.download-btn {
            background: #0284c7;
        }

        .paper-links a.download-btn:hover {
            background: #0369a1;
        }

        .paper-links a.missing {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .action-btns-group {
            display: flex;
            gap: 0.5rem;
        }

        .action-btns-group button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }

        .edit-action-btn { background: #f59e0b; color: #0f172a; }
        .delete-action-btn { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="admin-badge" id="adminToggleBtn" onclick="toggleAdminMode()">🔐 Admin Access</div>
        <h1>📚 Board Study Material</h1>
        <p>Maharashtra Board — View & Download PDFs Instantly</p>
    </header>

    <div class="container">
        <div class="breadcrumb" id="breadcrumb" onclick="goHome()" style="display: none;">🏠 Home / <span id="currentPath"></span></div>

        <div class="admin-panel" id="adminPanel">
            <h3 id="panelTitle" style="width:100%; color:#38bdf8; margin:0;">Create New Book Category</h3>
            <input type="text" id="inputName" placeholder="Enter name (e.g., 10th SSC, Subject, Year)...">
            <input type="text" id="inputDesc" placeholder="Short description or notes...">
            
            <div id="paperInputs" style="display:none; width:100%; gap:1rem; display:flex; flex-wrap:wrap;">
                <input type="text" id="inputQLink" placeholder="Question Paper PDF Link / Drive Link">
                <input type="text" id="inputALink" placeholder="Answer PDF Link (Leave blank if not available)">
            </div>

            <button onclick="handleCreate()">+ Save & Update</button>
        </div>

        <div class="grid-container" id="mainContainer"></div>
    </div>

    <script>
        const defaultData = [
            { id: 1, name: "10th SSC Board", desc: "Click to Open & Explore 🚀", type: "category", subjects: [] },
            { id: 2, name: "12th HSC Board", desc: "Click to Open & Explore 🚀", type: "category", subjects: [] }
        ];

        let isAdmin = false;
        const SECRET_PASSWORD = "#Sanika912007@#";
        
        let currentView = 'categories'; 
        let selectedCategoryId = null;
        let selectedSubjectId = null;

        function getData() {
            const saved = localStorage.getItem('permanentPortalData_v8');
            if (saved) {
                return JSON.parse(saved);
            }
            return defaultData;
        }

        function saveData(data) {
            localStorage.setItem('permanentPortalData_v8', JSON.stringify(data));
        }

        function render() {
            const container = document.getElementById('mainContainer');
            const breadcrumb = document.getElementById('breadcrumb');
            const currentPath = document.getElementById('currentPath');
            const panelTitle = document.getElementById('panelTitle');
            const paperInputs = document.getElementById('paperInputs');
            
            container.innerHTML = '';
            const data = getData();

            if (currentView === 'categories') {
                breadcrumb.style.display = 'none';
                panelTitle.innerText = "Create New Board Category";
                paperInputs.style.display = 'none';

                data.forEach((cat, index) => {
                    container.appendChild(createBookCard(cat.name, cat.desc, cat.id, 'category', index >= 2));
                });
            } 
            else if (currentView === 'subjects') {
                breadcrumb.style.display = 'block';
                const cat = data.find(c => c.id === selectedCategoryId);
                currentPath.innerText = cat ? cat.name : '';
                panelTitle.innerText = cat ? `Create Subject in ${cat.name}` : '';
                paperInputs.style.display = 'none';

                if (cat) {
                    cat.subjects.forEach(sub => {
                        container.appendChild(createBookCard(sub.name, sub.desc, sub.id, 'subject', true));
                    });
                }
            } 
            else if (currentView === 'years') {
                breadcrumb.style.display = 'block';
                const cat = data.find(c => c.id === selectedCategoryId);
                const sub = cat ? cat.subjects.find(s => s.id === selectedSubjectId) : null;
                currentPath.innerText = cat && sub ? `${cat.name} > ${sub.name}` : '';
                panelTitle.innerText = sub ? `Add Year & PDF for ${sub.name}` : '';
                paperInputs.style.display = 'flex';

                if (sub) {
                    sub.years.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'paper-row';
                        
                        let ansHTML = item.aLink ? `
                            <a href="${item.aLink}" target="_blank">📄 View Answer</a>
                            <a href="${item.aLink}" class="download-btn" download>📥 Download Answer</a>
                        ` : `<a class="missing" href="#">❌ Answer Not Available Yet</a>`;

                        let editDeleteHTML = isAdmin ? `
                            <div class="action-btns-group">
                                <button class="edit-action-btn" style="display:inline-block;" onclick="editYear(${item.id})">✏️ Edit</button>
                                <button class="delete-action-btn" style="display:inline-block;" onclick="deleteYear(${item.id})">🗑️ Delete</button>
                            </div>
                        ` : '';

                        row.innerHTML = `
                            <div>
                                <h3 style="margin:0; color:#fff;">Year: ${item.year}</h3>
                            </div>
                            <div class="paper-links">
                                <a href="${item.qLink || '#'}" target="_blank">📄 View Question</a>
                                <a href="${item.qLink || '#'}" class="download-btn" download>📥 Download Question</a>
                                ${ansHTML}
                            </div>
                            ${editDeleteHTML}
                        `;
                        container.appendChild(row);
                    });
                }
            }

            document.querySelectorAll('.card-delete-btn').forEach(btn => {
                btn.style.display = isAdmin ? 'flex' : 'none';
            });
            document.querySelectorAll('.edit-action-btn, .delete-action-btn').forEach(btn => {
                btn.style.display = isAdmin ? 'inline-block' : 'none';
            });
        }

        function createBookCard(title, desc, id, type, isDeletable) {
            const card = document.createElement('div');
            card.className = 'book-card';
            
            let deleteBtnHTML = '';
            if (isAdmin && isDeletable) {
                deleteBtnHTML = `<button class="delete-btn card-delete-btn" style="display:flex;" onclick="event.stopPropagation(); deleteItem(${id}, '${type}')">×</button>`;
            }

            card.innerHTML = `
                ${deleteBtnHTML}
                <div class="book-icon">📖</div>
                <h3>${title}</h3>
                <p>${desc}</p>
            `;

            card.onclick = () => {
                if (type === 'category') {
                    selectedCategoryId = id;
                    currentView = 'subjects';
                } else if (type === 'subject') {
                    selectedSubjectId = id;
                    currentView = 'years';
                }
                render();
            };

            return card;
        }

        function goHome() {
            currentView = 'categories';
            selectedCategoryId = null;
            selectedSubjectId = null;
            render();
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                let pass = prompt("Enter Secret Admin Password:");
                if (pass === SECRET_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').style.display = 'flex';
                    document.getElementById('adminToggleBtn').innerText = '🔓 Admin Unlocked';
                    alert("Admin unlocked! You can now manage files.");
                    render();
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('adminToggleBtn').innerText = '🔐 Admin Access';
                alert("Logged out securely.");
                render();
            }
        }

        function handleCreate() {
            const name = document.getElementById('inputName').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            if (!name) {
                alert("Please enter a name!");
                return;
            }

            const data = getData();

            if (currentView === 'categories') {
                data.push({ id: Date.now(), name: name, desc: desc || "Click to Open & Explore 🚀", subjects: [] });
            } else if (currentView === 'subjects') {
                const cat = data.find(c => c.id === selectedCategoryId);
                if (cat) {
                    cat.subjects.push({ id: Date.now(), name: name, desc: desc || "Papers & Solutions", years: [] });
                }
            } else if (currentView === 'years') {
                const cat = data.find(c => c.id === selectedCategoryId);
                const sub = cat ? cat.subjects.find(s => s.id === selectedSubjectId) : null;
                if (sub) {
                    const qLink = document.getElementById('inputQLink').value.trim();
                    const aLink = document.getElementById('inputALink').value.trim();
                    
                    sub.years.push({ id: Date.now(), year: name, qLink: qLink, aLink: aLink });
                    document.getElementById('inputQLink').value = '';
                    document.getElementById('inputALink').value = '';
                }
            }

            saveData(data);
            document.getElementById('inputName').value = '';
            document.getElementById('inputDesc').value = '';
            render();
            alert("Saved successfully!");
        }

        function deleteItem(id, type) {
            if (!confirm("Are you sure you want to delete this item?")) return;
            const data = getData();

            if (type === 'category') {
                const index = data.findIndex(c => c.id === id);
                if (index !== -1) data.splice(index, 1);
            } else if (type === 'subject') {
                const cat = data.find(c => c.id === selectedCategoryId);
                if (cat) {
                    cat.subjects = cat.subjects.filter(s => s.id !== id);
                }
            }

            saveData(data);
            render();
        }

        function deleteYear(id) {
            if (!confirm("Are you sure you want to delete this paper?")) return;
            const data = getData();
            const cat = data.find(c => c.id === selectedCategoryId);
            const sub = cat ? cat.subjects.find(s => s.id === selectedSubjectId) : null;
            if (sub) {
                sub.years = sub.years.filter(y => y.id !== id);
                saveData(data);
                render();
            }
        }

        function editYear(id) {
            const data = getData();
            const cat = data.find(c => c.id === selectedCategoryId);
            const sub = cat ? cat.subjects.find(s => s.id === selectedSubjectId) : null;
            if (!sub) return;
            
            let yearItem = sub.years.find(y => y.id === id);
            if (!yearItem) return;

            let newYear = prompt("Edit Year:", yearItem.year);
            let newQ = prompt("Edit Question Paper Link:", yearItem.qLink);
            let newA = prompt("Edit Answer Link:", yearItem.aLink);

            if (newYear !== null) yearItem.year = newYear;
            if (newQ !== null) yearItem.qLink = newQ;
            if (newA !== null) yearItem.aLink = newA;

            saveData(data);
            render();
            alert("Updated successfully!");
        }

        window.onload = render;
    </script>

</body>
</html>
